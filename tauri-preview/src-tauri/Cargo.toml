[package]
name = "ukikura-tauri"
version = "1.0.6"
description = "Ukikura Nusa Dynamic Island — Ultra-Lightweight Tauri 2.0 Edition"
authors = ["Naufal <muhnaufal11>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Media_Control"
] }
