[package]
name = "Ukikura"
version = "1.0.6"
edition = "2021"

[dependencies]
webview2 = "0.1.4"
webview2-sys = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winapi = { version = "0.3.9", features = [
    "winuser",
    "wingdi",
    "libloaderapi",
    "shellapi",
    "processthreadsapi",
    "synchapi",
    "handleapi",
    "winbase",
    "winreg",
    "winnt",
    "dwmapi",
    "uxtheme",
    "objbase",
    "combaseapi"
] }
