[package]
name = "ukikura-host"
version = "1.0.6"
edition = "2021"
description = "Ukikura Dynamic Island - Native tao + wry WebView2 Host"

[[bin]]
name = "Ukikura"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_UI_Shell",
]
